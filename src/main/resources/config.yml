# MSkyWars configuration file (Paper 1.21.x)

# the language used for the messages (lang folder: en, es_cl)
locale: es_cl

# chat prefixes (usa %s para el nombre MSkyWars en formatos personalizados)
prefix: "&8[&b&lMSkyWars&8] &7"
debug_prefix: "&8[&7MSkyWars-Debug&8] &7"

# the url for displaying the %url% placeholder (scoreboard)
url: "www.example.com"

# the format for displaying the %date% placeholder (scoreboard)
dateFormat: "dd/MM/yyyy"

# minimum players to start the game automatically
minPlayers: 2

# you may want to disable these
tabListEnabled: true
signsEnabled: true
messageSounds:
  enabled: true
  sound: ENTITY_ITEM_PICKUP
disableWeather: true

sounds: # sound name; volume; pitch (nombres modernos 1.21.x o alias clasicos)
  join: ENTITY_HORSE_ARMOR; .75; .75
  leave: ENTITY_ITEM_PICKUP; 1; 0.1
  countdown: BLOCK_NOTE_BLOCK_HAT; 3; 1
  start:
    - BLOCK_NOTE_BLOCK_PLING; 0.5; 1
    - BLOCK_PORTAL_TRIGGER; 0.5; 5
  REFILL: ENTITY_PLAYER_LEVELUP; 1; 1
  ENDER_DRAGON: ENTITY_ENDERDRAGON_GROWL; 1; 1
  LUCKYBLOCK_GOOD: ENTITY_PLAYER_LEVELUP; 1; 1.5
  LUCKYBLOCK_BAD: ENTITY_GENERIC_EXPLODE; 1; 0.8
  LUCKYBLOCK_MOB: ENTITY_CREEPER_PRIMED; 1; 1

end_portal_joins_random_game: true

# this is the reset cooldown for last hits (in seconds)
lastHitResetCooldown: 15

# this is the default height for the center of maps
defaultArenaCenterHeight: 100

# map size used for boundary calculation; in blocks
maxMapSize: 200

scoreboard:
  enabled: true
  # you can change this if there is a name collision
  objective_name: skywars

# filter where the lobby scoreboard and tabList shows
# leave empty to show in all worlds
# lobby_worlds: []
lobby_worlds:
  - world
  - lobby

# update task for actionbar and scoreboard
taskUpdate:
  disabled: false
  interval: 1 # seconds

time: # seconds
  starting: 10
  ending: 10

# the amount of fireworks threw at the end of a game
endFireworks: 3

# invincibility at the start of the game
# (to prevent fall damage after dropping from the cages)
invincibility:
  enabled: true
  # the amount of ticks the players are invincible for
  ticks: 40

economy:
  enabled: true
  play: 10
  kill: 25
  win: 100

# souls is the economy used for buying soul crates
souls:
  enabled: true
  kill: 1

# LuckyBlocks de MSkyWars (ver luckyblocks.yml para la lista de sorpresas)
# Para posiciones fijas por mapa (como los beacons de spawns): coloca bloques
# del material de luckyblocks.yml en el mundo del mapa y ejecuta
# /sw calculateluckyblocks <mapa> o el boton del menu /sw config.
luckyblocks:
  enabled: true
  # bloques automaticos por isla SOLO si el mapa no tiene posiciones registradas
  per_island: 3
  # luckyblocks extra en el inventario al empezar (0 = ninguno)
  give_on_start: 0

# this is used to format money
decimalFormat: "0.#"

# you can disable the plugin commands here
# possible options: start, forcestart, leave, where, skywars
# you probably dont want to disable the last one lol
disabledCommands: [ ]

# this is represented as
# slot (from 0 to 8): item type

# possible item types:
# KIT_SELECTOR - menu to select kit
# GAME_OPTIONS - menu to change the game options
# LEAVE - same as /sw leave or /leave
# TELEPORTER - menu for selecting someone to spectate (not yet implemented)
# SPECTATOR_OPTIONS - spectator options as speed, night vision, etc (not yet implemented)
# ARENAS_MENU - arena menu to join a game
# JOIN_RANDOM_ARENA - instantly join an arena (not yet implemented)

items:
  waiting:
    0: KIT_SELECTOR
    1: GAME_OPTIONS
    4: START_GAME
    8: LEAVE
  spectator:
    0: TELEPORTER
    1: SPECTATOR_OPTIONS
    4: STOP_GAME
    7: PLAY_AGAIN
    8: LEAVE
  # if for some reason you want to give items when the game starts
  # you can do so here
  # (not yet implemented)
  playing: { }

# you can make custom items by adding them here
# you can add the details (name, description) in the lang file
item_types:
  KIT_SELECTOR: BOW
  GAME_OPTIONS: PAPER
  START_GAME: BLAZE_POWDER
  STOP_GAME: BARRIER
  PLAY_AGAIN: PAPER
  LEAVE: BED # RED_BED if 1.13+
  SPECTATOR_OPTIONS: REDSTONE_COMPARATOR # COMPARATOR if 1.13+
  TELEPORTER: COMPASS

debug:
  # enable this to see debug messages
  enabled: false
  bigCases: false
  projectileTests: false

# do not enable updates nor autoUpdate
# it breaks the plugin (for now)
disableUpdates: true
autoUpdate: false
